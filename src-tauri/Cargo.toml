[package]
name = "linglux"
version = "0.1.0"
description = "Linglux desktop application"
authors = ["Linglux"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["crates/linglux-media-core"]
resolver = "2"

[lib]
name = "linglux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linglux-media-core = { path = "crates/linglux-media-core" }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"

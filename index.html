<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linglux</title>
    <style>
      html,
      body {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #070708;
        color: #d1d5db;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        overflow: hidden;
      }

      #app {
        min-height: 100vh;
      }

      #linglux-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgb(16 185 129 / 0.1), transparent 30%),
          #070708;
        transition: opacity 160ms ease;
      }

      #linglux-boot[data-state="ready"] {
        pointer-events: none;
        opacity: 0;
      }

      .linglux-boot-card {
        display: grid;
        min-width: 260px;
        justify-items: center;
        gap: 14px;
        padding: 28px;
        text-align: center;
      }

      .linglux-boot-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgb(52 211 153 / 0.45);
        border-radius: 12px;
        background: rgb(16 185 129 / 0.1);
        box-shadow: 0 0 30px rgb(16 185 129 / 0.12);
        color: #6ee7b7;
        font-weight: 800;
      }

      .linglux-boot-title {
        margin: 0;
        color: #f4f4f5;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .linglux-boot-status {
        max-width: 460px;
        margin: 0;
        color: #71717a;
        font-size: 12px;
        line-height: 1.6;
      }

      #linglux-boot[data-state="loading"] .linglux-boot-mark {
        animation: linglux-boot-pulse 1.1s ease-in-out infinite alternate;
      }

      #linglux-boot[data-state="error"] .linglux-boot-mark {
        border-color: rgb(248 113 113 / 0.55);
        background: rgb(239 68 68 / 0.1);
        color: #fca5a5;
      }

      .linglux-boot-retry {
        display: none;
        border: 1px solid rgb(52 211 153 / 0.35);
        border-radius: 6px;
        padding: 8px 14px;
        background: rgb(16 185 129 / 0.12);
        color: #a7f3d0;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
      }

      #linglux-boot[data-state="error"] .linglux-boot-retry {
        display: inline-flex;
      }

      @keyframes linglux-boot-pulse {
        from {
          opacity: 0.55;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #linglux-boot,
        #linglux-boot .linglux-boot-mark {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="linglux-boot" data-state="loading" role="status" aria-live="polite">
      <div class="linglux-boot-card">
        <div class="linglux-boot-mark" aria-hidden="true">L</div>
        <p class="linglux-boot-title">LINGLUX</p>
        <p class="linglux-boot-status">正在启动创作工作台…</p>
        <button class="linglux-boot-retry" type="button" onclick="location.reload()">重新加载</button>
      </div>
    </div>
    <div id="app" class="isolate"></div>
    <script>
      (() => {
        const boot = document.querySelector("#linglux-boot");
        const status = boot?.querySelector(".linglux-boot-status");
        const retryKey = "linglux:dev-boot-retries";
        let ready = false;

        const messageOf = (reason) => {
          if (reason instanceof Error) return reason.message;
          if (typeof reason === "string") return reason;
          return "前端入口没有成功加载";
        };

        const fail = (reason) => {
          if (ready || !boot || !status) return;
          const message = messageOf(reason);
          boot.dataset.state = "error";
          status.textContent = `启动失败：${message}`;

          if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
            const retryCount = Number(sessionStorage.getItem(retryKey) || "0");
            if (retryCount < 2) {
              sessionStorage.setItem(retryKey, String(retryCount + 1));
              status.textContent = `开发服务暂未就绪，正在重新连接（${retryCount + 1}/2）…`;
              window.setTimeout(() => location.reload(), 700 * (retryCount + 1));
            }
          }
        };

        window.__LINGLUX_BOOT__ = {
          ready() {
            if (!boot) return;
            ready = true;
            sessionStorage.removeItem(retryKey);
            boot.dataset.state = "ready";
            window.setTimeout(() => boot.remove(), 180);
          },
          fail,
        };

        window.addEventListener("error", (event) => fail(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => fail(event.reason));
      })();
    </script>
    <script type="module" src="/src/main.ts" onerror="window.__LINGLUX_BOOT__?.fail('入口模块加载失败')"></script>
  </body>
</html>
